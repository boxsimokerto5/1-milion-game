<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#0369a1" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="controllerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.65" />
    </filter>

    <filter id="coinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ca8a04" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bgGradient)" />
  <circle cx="512" cy="460" r="430" fill="url(#ambientGlow)" />

  <g stroke="#38bdf8" stroke-width="3" opacity="0.3" fill="none">
    <circle cx="512" cy="512" r="390" stroke-dasharray="16 20" />
    <circle cx="512" cy="512" r="440" stroke-dasharray="8 24" />
  </g>

  <!-- Main Gamepad Controller Geometry -->
  <g filter="url(#softShadow)">
    <path d="M 330 330 
             C 410 330, 450 375, 512 375 
             C 574 375, 614 330, 694 330 
             C 770 330, 810 380, 795 530 
             C 780 640, 720 675, 650 645 
             C 590 620, 570 560, 512 560 
             C 454 560, 434 620, 374 645 
             C 304 675, 244 640, 229 530 
             C 214 380, 254 330, 330 330 Z" 
          fill="url(#controllerBody)" 
          stroke="#cbd5e1" 
          stroke-width="6" />

    <g transform="translate(345, 475)">
      <rect x="-42" y="-14" width="84" height="28" rx="7" fill="#0284c7" />
      <rect x="-14" y="-42" width="28" height="84" rx="7" fill="#0284c7" />
      <circle cx="0" cy="0" r="10" fill="#0369a1" />
      <polygon points="0,-33 -6,-24 6,-24" fill="#ffffff" />
      <polygon points="0,33 -6,24 6,24" fill="#ffffff" />
      <polygon points="-33,0 -24,-6 -24,6" fill="#ffffff" />
      <polygon points="33,0 24,-6 24,6" fill="#ffffff" />
    </g>

    <g transform="translate(675, 475)">
      <circle cx="0" cy="-28" r="15" fill="#10b981" filter="url(#softShadow)" />
      <circle cx="0" cy="-28" r="6" fill="#ffffff" />
      <circle cx="0" cy="28" r="15" fill="#0284c7" filter="url(#softShadow)" />
      <circle cx="0" cy="28" r="6" fill="#ffffff" />
      <circle cx="-28" cy="0" r="15" fill="#f59e0b" filter="url(#softShadow)" />
      <circle cx="-28" cy="0" r="6" fill="#ffffff" />
      <circle cx="28" cy="0" r="15" fill="#ef4444" filter="url(#softShadow)" />
      <circle cx="28" cy="0" r="6" fill="#ffffff" />
    </g>

    <!-- Center Glowing DANA Coin "Rp" -->
    <g transform="translate(512, 465)" filter="url(#coinGlow)">
      <circle cx="0" cy="0" r="48" fill="url(#goldCoin)" stroke="#fef08a" stroke-width="4" />
      <circle cx="0" cy="0" r="38" fill="#eab308" stroke="#fef08a" stroke-width="2" stroke-dasharray="6 4" />
      <text x="0" y="11" 
            fill="#ffffff" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-weight="900" 
            font-size="28" 
            text-anchor="middle" 
            letter-spacing="1">Rp</text>
    </g>
  </g>

  <!-- Bottom App Name Ribbon Tag -->
  <g transform="translate(512, 755)" filter="url(#softShadow)">
    <rect x="-240" y="-36" width="480" height="72" rx="22" 
          fill="#0284c7" 
          stroke="#38bdf8" 
          stroke-width="3" />
    <text x="0" y="9" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="30" 
          text-anchor="middle" 
          letter-spacing="4">GAME SALDO DANA</text>
    <text x="0" y="44" 
          fill="#fef08a" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="14" 
          text-anchor="middle" 
          letter-spacing="3">REWARD POINT &amp; CASHOUT</text>
  </g>

  <g fill="#fef08a" opacity="0.85">
    <path d="M 280 260 Q 280 280 260 280 Q 280 280 280 300 Q 280 280 300 280 Q 280 280 280 260 Z" />
    <path d="M 740 240 Q 740 260 720 260 Q 740 260 740 280 Q 740 260 760 260 Q 740 260 740 240 Z" />
    <circle cx="780" cy="360" r="6" fill="#38bdf8" />
    <circle cx="230" cy="380" r="5" fill="#facc15" />
  </g>
</svg>
