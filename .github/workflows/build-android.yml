name: Build Android APK and AAB (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Generate Android App Icons from SVG
        run: |
          npx @capacitor/assets generate --android || echo "Asset generation skipped or completed"

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Capacitor Android project..."
            npx cap add android
          fi
          echo "Syncing web assets to Android..."
          npx cap sync android

      - name: Inject Unity Ads Native SDK and JavaScript Bridge
        run: |
          python3 scripts/configure-unity-ads.py

      - name: Configure Android Manifest (Hardware Acceleration & Immersive Fullscreen)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Enable hardware acceleration and cleartext traffic if needed
            sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true"/g' $MANIFEST || true
          fi

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Setup Signing Config di build.gradle sebelum compile
      - name: Configure Keystore and Gradle Signing
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "Menggunakan Keystore dari GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties
          else
            echo "Membuat Keystore otomatis untuk build yang langsung bisa diinstall..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias astrocade \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidkey123 \
              -keypass androidkey123 \
              -dname "CN=Astrocade, OU=Mobile, O=Astrocade, L=Jakarta, ST=Jakarta, C=ID"
            echo "RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
            echo "RELEASE_KEY_ALIAS=astrocade" >> android/gradle.properties
            echo "RELEASE_STORE_PASSWORD=androidkey123" >> android/gradle.properties
            echo "RELEASE_KEY_PASSWORD=androidkey123" >> android/gradle.properties
          fi

          # Tambahkan signingConfig release ke android/app/build.gradle
          python3 scripts/configure-signing.py

      - name: Build Signed APK and AAB
        run: |
          cd android
          chmod +x gradlew
          echo "Building Debug APK (Pasti langsung bisa diinstall di SEMUA ponsel)..."
          ./gradlew assembleDebug
          echo "Building Release APK (Signed dengan v1 + v2 scheme)..."
          ./gradlew assembleRelease || true
          echo "Building Release AAB..."
          ./gradlew bundleRelease || true

      # Upload Artifact APK Siap Pasang di HP
      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astrocade-Game-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      # Upload Artifact Google Play AAB
      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Astrocade-GooglePlay-AAB
          path: |
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
