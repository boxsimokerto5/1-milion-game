name: Build Android APK and AAB (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Generate Android App Icons from SVG
        run: |
          npx @capacitor/assets generate --android || echo "Asset generation skipped or completed"

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Capacitor Android project..."
            npx cap add android
          fi
          echo "Syncing web assets to Android..."
          npx cap sync android

      - name: Configure Android Manifest (Hardware Acceleration & Immersive Fullscreen)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Enable hardware acceleration and cleartext traffic if needed
            sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true"/g' $MANIFEST || true
          fi

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK and AAB (Bundle)
        run: |
          cd android
          chmod +x gradlew
          echo "Building Release APK..."
          ./gradlew assembleRelease
          echo "Building Release AAB (Android App Bundle for Google Play)..."
          ./gradlew bundleRelease

      # Generate Keystore otomatis jika secrets tidak diset oleh user
      - name: Generate Automatic Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "Menggunakan Keystore dari GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Membuat Keystore otomatis dengan keytool..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias astrocade \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass androidkey123 \
              -keypass androidkey123 \
              -dname "CN=Astrocade, OU=Mobile, O=Astrocade, L=Jakarta, ST=Jakarta, C=ID"
            echo "KEY_ALIAS=astrocade" >> $GITHUB_ENV
            echo "KEYSTORE_PASS=androidkey123" >> $GITHUB_ENV
            echo "KEY_PASS=androidkey123" >> $GITHUB_ENV
          fi

      # Sign APK secara otomatis menggunakan apksigner dari Android SDK
      - name: Automatically Sign Release APK
        run: |
          cd android/app/build/outputs/apk/release
          # Cari file apk release
          APK_FILE=$(ls *-unsigned.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          fi
          echo "File APK target: $APK_FILE"
          
          # Gunakan jarsigner untuk menandatangani APK
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore ../../../../release.keystore \
            -storepass $KEYSTORE_PASS \
            -keypass $KEY_PASS \
            $APK_FILE $KEY_ALIAS
            
          # Rename agar jelas bahwa APK sudah ditandatangani dan siap install
          cp $APK_FILE app-release-signed.apk
          echo "APK berhasil ditandatangani: app-release-signed.apk"

      # Sign AAB (Google Play Bundle) secara otomatis menggunakan jarsigner
      - name: Automatically Sign Release AAB
        run: |
          cd android/app/build/outputs/bundle/release
          AAB_FILE=$(ls *.aab 2>/dev/null | head -n 1)
          echo "File AAB target: $AAB_FILE"
          
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore ../../../../release.keystore \
            -storepass $KEYSTORE_PASS \
            -keypass $KEY_PASS \
            $AAB_FILE $KEY_ALIAS
            
          cp $AAB_FILE app-release-signed.aab
          echo "AAB berhasil ditandatangani: app-release-signed.aab"

      # Upload Signed APK Artifact (Langsung bisa diinstall di HP)
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astrocade-Signed-APK
          path: |
            android/app/build/outputs/apk/release/*signed*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Upload Signed AAB Artifact (Siap diunggah ke Google Play Console)
      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astrocade-Signed-GooglePlay-AAB
          path: |
            android/app/build/outputs/bundle/release/*signed*.aab
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
