name: Build Android APK and AAB (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Generate Android App Icons from SVG
        run: |
          npx @capacitor/assets generate --android || echo "Asset generation skipped or completed"

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Creating Capacitor Android project..."
            npx cap add android
          fi
          echo "Syncing web assets to Android..."
          npx cap sync android

      - name: Configure Android Manifest (Hardware Acceleration & Immersive Fullscreen)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Enable hardware acceleration and cleartext traffic if needed
            sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true"/g' $MANIFEST || true
          fi

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK and AAB (Bundle)
        run: |
          cd android
          chmod +x gradlew
          echo "Building Release APK..."
          ./gradlew assembleRelease
          echo "Building Release AAB (Android App Bundle for Google Play)..."
          ./gradlew bundleRelease

      # Check if GitHub Secrets are provided for Signing
      - name: Check Signing Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Warning: Keystore secrets not detected. Will upload unsigned release APK & AAB."
          fi

      # Sign APK & AAB if Secrets are provided
      - name: Decode Keystore File
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Sign Release APK
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Release AAB (for Google Play Store)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Upload Signed or Unsigned APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astrocade-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # Upload Signed or Unsigned AAB (Google Play Bundle) Artifact
      - name: Upload AAB (Google Play Store Bundle) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astrocade-GooglePlay-AAB
          path: |
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
